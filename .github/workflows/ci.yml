name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, test, and gate on the eval harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contractlens
          POSTGRES_PASSWORD: contractlens
          POSTGRES_DB: contractlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contractlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://contractlens:contractlens@localhost:5432/contractlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q -p no:warnings
      - name: Evaluation harness (release gate, offline profile)
        run: contractlens eval --ingest data/corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/latest.*

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t contractlens:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name cl -p 8000:8000 contractlens:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break || sleep 2; done
          curl -fsS localhost:8000/health
          docker rm -f cl
