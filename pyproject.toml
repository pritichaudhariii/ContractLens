[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractlens"
version = "1.0.0"
description = "Enterprise document Q&A over contracts and regulatory filings: LangGraph workflow, hybrid pgvector retrieval, citation-grounded answers, and an evaluation harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "langgraph>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pypdf>=5",
  "python-multipart>=0.0.9",
  "anthropic>=0.50",
  "voyageai>=0.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pgserver>=0.1.4",
]

[project.scripts]
contractlens = "contractlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contractlens = ["store/schema.sql", "ui/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# E501: line length is handled by the formatter. B008: FastAPI's Depends()/File()/Form() defaults are the framework idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:XDG_RUNTIME_DIR"]
